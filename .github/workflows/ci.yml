name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev_requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        # 完整输出写文件，只打印尾部：失败时既能看到摘要与首个 traceback，
        # 又不会让 GitHub 因步骤日志过大而截断（截断后反而看不到根因）。
        # 同时只对纯规则模块采集覆盖率（main 等入口层不设硬门槛）。
        run: |
          set +e
          pytest -q \
            --cov=astrbot_plugin_image_trace.image_delivery \
            --cov=astrbot_plugin_image_trace.features \
            --cov=astrbot_plugin_image_trace.weibo_posts \
            --cov=astrbot_plugin_image_trace.delivery.planner \
            --cov=astrbot_plugin_image_trace.config \
            --cov-report=json:coverage.json \
            > pytest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::pytest (tail -n 250)"
            tail -n 250 pytest.log
            echo "::endgroup::"
          else
            tail -n 20 pytest.log
          fi
          exit "$status"
      - name: Coverage gate
        run: python scripts/check_coverage.py coverage.json
